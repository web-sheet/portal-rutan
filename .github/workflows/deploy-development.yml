name: Deploy Rutan

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================
      # DEBUG (boleh dihapus nanti)
      # =========================
      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type d

      # =========================
      # BUILD VUE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: vue-project
        
        run: npm install

      - name: Build Frontend
        working-directory: vue-project
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # =========================
      # SETUP SSH
      # =========================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      # =========================
      # PASTIKAN FOLDER ADA
      # =========================
      - name: Create Deployment Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            mkdir -p domains/bapasjakpus.com/public_html/rutan/frontend
            mkdir -p domains/bapasjakpus.com/public_html/rutan/backend

      # =========================
      # DEPLOY FRONTEND
      # =========================
      - name: Deploy Frontend
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PORT }}" \
            vue-project/dist/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:domains/bapasjakpus.com/public_html/rutan/frontend/

      # =========================
      # DEPLOY BACKEND
      # =========================
      - name: Deploy Backend
        run: |
          rsync -avz --delete \
            --exclude=".env" \
            --exclude="vendor" \
            --exclude="node_modules" \
            --exclude=".git" \
            --exclude="storage/logs/**" \
            --exclude="storage/framework/cache/**" \
            --exclude="storage/framework/sessions/**" \
            --exclude="storage/framework/views/**" \
            -e "ssh -p ${{ secrets.PORT }}" \
            rutan-api/ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:domains/bapasjakpus.com/public_html/rutan/backend/

      # =========================
      # LARAVEL COMMANDS
      # =========================
      - name: Run Laravel Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd domains/bapasjakpus.com/public_html/rutan/backend

            echo "Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "Running migrations..."
            php artisan migrate --force

            echo "Clearing caches..."
            php artisan route:clear
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear

            echo "Optimizing..."
            php artisan optimize

            echo "Deploy selesai"